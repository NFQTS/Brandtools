<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
	<title>✳️💜🥷🏻Unprincipled Inc. Web3 OS🥷🏻💜✳️</title>

	<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>

	<style>
		@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Press+Start+2P&display=swap');

		* {
			margin: 0;
			padding: 0;
			box-sizing: border-box;
		}

		body {
			overflow: hidden;
			background: #000;
			color: #fff;
			font-family: 'Orbitron', sans-serif;
			height: 100vh;
			position: relative;
		}

		canvas {
			position: absolute;
			top: 0;
			left: 0;
			z-index: 1;
		}

		.content {
			position: relative;
			z-index: 2;
			height: 100vh;
			display: flex;
			flex-direction: column;
			justify-content: center;
			align-items: center;
			text-align: center;
			padding: 20px;
		}

		.logo {
			font-size: 2.8rem;
			font-weight: 900;
			letter-spacing: 0.4em;
			margin-bottom: 1.5rem;
			background: linear-gradient(90deg, #fff, #aaa, #fff);
			-webkit-background-clip: text;
			-webkit-text-fill-color: transparent;
			text-shadow: 0 0 30px rgba(255,255,255,0.6);
			opacity: 0;
			transition: opacity 1.5s ease;
		}

		.teaser {
			font-family: 'Press Start 2P', cursive;
			font-size: 1.25rem;
			margin: 1.2rem 0;
			min-height: 90px;
			background: linear-gradient(90deg, #ff00ff, #00ffff, #ffff00, #ff00ff);
			-webkit-background-clip: text;
			-webkit-text-fill-color: transparent;
			background-size: 300% 300%;
			animation: rainbow 6s linear infinite;
			text-shadow: 0 0 20px rgba(255,255,255,0.5);
			opacity: 0;
		}

		.reveal {
			font-size: 3.8rem;
			font-weight: 900;
			letter-spacing: 0.15em;
			margin: 2.5rem 0 2rem;
			color: #fff;
			text-shadow: 0 0 40px #fff, 0 0 80px #ff00ff;
			opacity: 0;
			animation: pulse 4s infinite alternate;
		}

		.blurred-art {
			width: 340px;
			height: 340px;
			background: #111;
			border: 3px solid #fff;
			box-shadow: 0 0 60px rgba(255,255,255,0.4), inset 0 0 60px rgba(255,255,255,0.1);
			margin: 2rem 0;
			position: relative;
			overflow: hidden;
			border-radius: 4px;
		}

		.signal-button {
			margin-top: 2rem;
			padding: 18px 48px;
			font-family: 'Press Start 2P', cursive;
			font-size: 1.1rem;
			background: transparent;
			color: #fff;
			border: 3px solid #fff;
			cursor: pointer;
			transition: 0.3s;
		}

		.signal-button:hover {
			background: #fff;
			color: #000;
		}

		.footer {
			position: absolute;
			bottom: 40px;
			font-size: 0.75rem;
			opacity: 0.5;
		}

		/* ================= GAME ================= */

		.trampoline-game {
			margin: 25px 0;
			padding: 15px;
			border: 2px solid rgba(255,255,255,0.2);
			background: rgba(0,0,0,0.45);
			backdrop-filter: blur(10px);
			border-radius: 12px;
		}

		.game-header {
			font-family: 'Press Start 2P', cursive;
			font-size: 0.85rem;
			margin-bottom: 10px;
			color: #00ffff;
		}

		#trampolineGame {
			background: radial-gradient(circle, rgba(30,30,50,0.9), rgba(0,0,0,0.95));
			border-radius: 10px;
			border: 1px solid rgba(255,255,255,0.15);
			cursor: pointer;
		}

		.game-stats {
			display: flex;
			justify-content: space-between;
			margin-top: 8px;
			font-size: 0.8rem;
		}

		.game-tip {
			margin-top: 8px;
			font-size: 0.7rem;
			opacity: 0.7;
		}

		@keyframes rainbow {
			0% { background-position: 0% 50%; }
			100% { background-position: 300% 50%; }
		}

		@keyframes pulse {
			from { text-shadow: 0 0 30px #fff; }
			to { text-shadow: 0 0 70px #ff00ff; }
		}
	</style>
</head>

<body>
<canvas id="space"></canvas>

<div class="content">

	<div class="reveal" id="reveal">SOMETHING IS COMING…</div>

	<div class="blurred-art"></div>

	<div class="teaser" id="teaser">333 LORDS AND LADIES</div>

	<div class="logo">UNPRINCIPLED INC.</div>

	<!-- GAME ADDED HERE -->
	<div class="trampoline-game">
		<div class="game-header">🏀 SKY BOUNCE</div>
		<canvas id="trampolineGame" width="420" height="260"></canvas>

		<div class="game-stats">
			<div>Height: <span id="heightScore">0</span></div>
			<div>Best: <span id="bestScore">0</span></div>
		</div>

		<div class="game-tip">CLICK WHEN BALL HITS TRAMPOLINE</div>
	</div>

	<button class="signal-button" onclick="handleSignal()">
		SUPPORT WEB3 NOW
	</button>

	<div class="footer">SOLANA • 2026 • TRANSMISSION INCOMING</div>
</div>

<script>
/* ================= THREE.JS SPACE ================= */

let scene, camera, renderer, particles;

function initSpace() {
	scene = new THREE.Scene();
	camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 2000);

	renderer = new THREE.WebGLRenderer({
		canvas: document.getElementById("space"),
		alpha: true
	});

	renderer.setSize(window.innerWidth, window.innerHeight);

	const geometry = new THREE.BufferGeometry();
	const vertices = [];
	const colors = [];

	for (let i = 0; i < 9000; i++) {
		vertices.push(
			Math.random()*2000-1000,
			Math.random()*2000-1000,
			Math.random()*1800-900
		);

		let c = Math.random();
		colors.push(c, c, c);
	}

	geometry.setAttribute("position", new THREE.Float32BufferAttribute(vertices, 3));
	geometry.setAttribute("color", new THREE.Float32BufferAttribute(colors, 3));

	const material = new THREE.PointsMaterial({
		size: 2,
		vertexColors: true,
		transparent: true
	});

	particles = new THREE.Points(geometry, material);
	scene.add(particles);

	camera.position.z = 5;
}

function animateSpace() {
	requestAnimationFrame(animateSpace);

	particles.rotation.y += 0.00008;

	const pos = particles.geometry.attributes.position.array;
	for (let i = 2; i < pos.length; i += 3) {
		pos[i] += 4.5;
		if (pos[i] > 900) pos[i] = -900;
	}
	particles.geometry.attributes.position.needsUpdate = true;

	renderer.render(scene, camera);
}

/* ================= TEASER ================= */

const teasers = [
	{ text:"333 LORDS AND LADIES" },
	{ text:"666 NOBLES" },
	{ text:"999 PEASANTS" }
];

let tIndex = 0;

function cycleTeaser() {
	tIndex = (tIndex + 1) % teasers.length;
	document.getElementById("teaser").textContent = teasers[tIndex].text;
}

/* ================= SIGNAL ================= */

function handleSignal() {
	window.open("https://x.com/intent/tweet?text=" +
	encodeURIComponent("Joining Unprincipled Inc 🚀"), "_blank");
}

/* ================= TRAMPOLINE GAME ================= */

const canvas = document.getElementById("trampolineGame");
const ctx = canvas.getContext("2d");

let y = 100;
let v = 0;
let g = 0.45;
let floor = 200;

let score = 0;
let best = 0;

function tap() {
	let near = y > floor-25 && y < floor+10 && v > 0;

	if (near) {
		v = -13;
		score += 10;
		if (score > best) best = score;
	} else {
		v += 6;
		score = Math.max(0, score - 10);
	}
}

canvas.addEventListener("click", tap);
canvas.addEventListener("touchstart", tap);

function loop() {
	ctx.clearRect(0,0,420,260);

	v += g;
	y += v;

	if (y > floor) {
		y = floor;
		v *= -0.5;
	}

	// trampoline
	ctx.strokeStyle = "#00ffff";
	ctx.lineWidth = 4;
	ctx.beginPath();
	ctx.moveTo(120,floor);
	ctx.lineTo(300,floor);
	ctx.stroke();

	// ball
	ctx.fillStyle = "#fff";
	ctx.beginPath();
	ctx.arc(210,y,10,0,Math.PI*2);
	ctx.fill();

	document.getElementById("heightScore").innerText = score;
	document.getElementById("bestScore").innerText = best;

	requestAnimationFrame(loop);
}

/* ================= INIT ================= */

window.onload = () => {
	initSpace();
	animateSpace();

	setTimeout(()=>document.getElementById("reveal").style.opacity=1,500);
	setInterval(cycleTeaser, 4000);

	loop();
};
</script>

</body>
</html>
