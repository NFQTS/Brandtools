<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sustainable Asset Network</title>

<style>

body{
    margin:0;
    background:#0b0f17;
    color:white;
    font-family:Inter,system-ui,sans-serif;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    overflow:hidden;
}

.title{
    position:absolute;
    top:40px;
    font-size:28px;
    font-weight:700;
    letter-spacing:6px;
    text-transform:uppercase;
}

svg{
    width:1100px;
    max-width:95vw;
}

.line{
    stroke:rgba(255,255,255,.12);
    stroke-width:3;
    stroke-dasharray:12 8;
    animation:dash 10s linear infinite;
}

@keyframes dash{
    to{
        stroke-dashoffset:-40;
    }
}

.asset{
    cursor:pointer;
}

.asset-image{
    transition:.4s;
}

.asset:hover .asset-image{
    filter:brightness(1.15);
}

.asset-ring{
    fill:none;
    stroke-width:5;
}

.asset-pulse{
    fill:none;
    stroke-width:2;
    opacity:.25;
    animation:pulse 4s infinite;
}

@keyframes pulse{
    0%,100%{
        r:74;
        opacity:.18;
    }
    50%{
        r:85;
        opacity:.38;
    }
}

.label{
    fill:white;
    font-size:15px;
    letter-spacing:2px;
    text-anchor:middle;
}

/* MARKETPLACE */

.market-panel{
    background:rgba(20,25,40,.88);
    border:1px solid rgba(255,255,255,.08);
    border-radius:18px;
    padding:14px;
    color:white;
    backdrop-filter:blur(12px);
}

.market-title{
    font-size:13px;
    font-weight:700;
    letter-spacing:2px;
    margin-bottom:12px;
}

.market-input{
    width:100%;
    padding:8px;
    border:none;
    border-radius:8px;
    background:#1e293b;
    color:white;
    margin-top:6px;
}

.market-btn{
    width:100%;
    margin-top:12px;
    padding:10px;
    border:none;
    border-radius:10px;
    background:#8b5cf6;
    color:white;
    cursor:pointer;
}

.market-btn:hover{
    opacity:.9;
}

.footer{
    margin-top:30px;
    opacity:.7;
}

#leaderboard{
    max-height:180px;
    overflow-y:auto;
    font-size:12px;
}

.offer-row{
    padding:8px;
    border-bottom:1px solid rgba(255,255,255,.08);
}

</style>
</head>

<body>

<div class="title">
Sustainable Asset Network
</div>

<svg viewBox="0 0 1100 620">

    <!-- CONNECTIONS -->

    <line class="line" x1="260" y1="420" x2="550" y2="180"/>
    <line class="line" x1="550" y1="180" x2="840" y2="420"/>
    <line class="line" x1="260" y1="420" x2="840" y2="420"/>

    <defs>

        <clipPath id="clipAquatics">
            <circle cx="260" cy="420" r="74"/>
        </clipPath>

        <clipPath id="clipData">
            <circle cx="550" cy="180" r="84"/>
        </clipPath>

        <clipPath id="clipNursery">
            <circle cx="840" cy="420" r="66"/>
        </clipPath>

    </defs>

    <!-- AQUATICS -->

    <g class="asset" id="aquatics">

        <image
            href="https://images.unsplash.com/photo-1544551763-46a013bb70d5"
            x="186"
            y="346"
            width="148"
            height="148"
            clip-path="url(#clipAquatics)"
            preserveAspectRatio="xMidYMid slice"
            class="asset-image"/>

        <circle
            class="asset-ring"
            cx="260"
            cy="420"
            r="74"
            stroke="#22d3ee"/>

        <circle
            class="asset-pulse"
            cx="260"
            cy="420"
            r="74"
            stroke="#22d3ee"/>

        <text class="label" x="260" y="528">
            AQUATICS
        </text>

    </g>

    <!-- DATA -->

    <g class="asset" id="data">

        <image
            href="https://images.unsplash.com/photo-1551288049-bebda4e38f71"
            x="466"
            y="96"
            width="168"
            height="168"
            clip-path="url(#clipData)"
            preserveAspectRatio="xMidYMid slice"
            class="asset-image"/>

        <circle
            class="asset-ring"
            cx="550"
            cy="180"
            r="84"
            stroke="#8b5cf6"/>

        <circle
            class="asset-pulse"
            cx="550"
            cy="180"
            r="84"
            stroke="#8b5cf6"/>

        <text class="label" x="550" y="292">
            DATA
        </text>

    </g>

    <!-- NURSERY -->

    <g class="asset" id="nursery">

        <image
            href="https://images.unsplash.com/photo-1466692476868-aef1dfb1e735"
            x="774"
            y="354"
            width="132"
            height="132"
            clip-path="url(#clipNursery)"
            preserveAspectRatio="xMidYMid slice"
            class="asset-image"/>

        <circle
            class="asset-ring"
            cx="840"
            cy="420"
            r="66"
            stroke="#34d399"/>

        <circle
            class="asset-pulse"
            cx="840"
            cy="420"
            r="66"
            stroke="#34d399"/>

        <text class="label" x="840" y="518">
            NURSERY
        </text>

    </g>

    <!-- OFFER PANEL -->

    <foreignObject
        x="340"
        y="255"
        width="220"
        height="240">

        <div xmlns="http://www.w3.org/1999/xhtml"
             class="market-panel">

            <div class="market-title">
                OFFER EQUITY
            </div>

            <label>Asset</label>

            <select id="assetSelect"
                    class="market-input">

                <option>Aquatics</option>
                <option>Data</option>
                <option>Nursery</option>

            </select>

            <label style="display:block;margin-top:12px;">
                Equity %
            </label>

            <input
                id="equitySlider"
                type="range"
                min="1"
                max="100"
                value="10"
                class="market-input">

            <div id="equityDisplay">
                10%
            </div>

            <input
                id="cryptoAmount"
                type="number"
                placeholder="Crypto Amount"
                class="market-input">

            <select
                id="cryptoType"
                class="market-input">

                <option>BTC</option>
                <option>ETH</option>
                <option>SOL</option>
                <option>USDC</option>

            </select>

            <button
                class="market-btn"
                onclick="submitOffer()">

                Submit Offer

            </button>

        </div>

    </foreignObject>

    <!-- LEADERBOARD -->

    <foreignObject
        x="575"
        y="245"
        width="250"
        height="250">

        <div xmlns="http://www.w3.org/1999/xhtml"
             class="market-panel">

            <div class="market-title">
                LEADERBOARD
            </div>

            <div id="leaderboard">

                <div class="offer-row">
                    No offers yet
                </div>

            </div>

        </div>

    </foreignObject>

</svg>

<div class="footer">
Click nodes to explore • Tokenized Asset Marketplace
</div>

<script>

const offers=[];

const slider =
document.getElementById("equitySlider");

slider.addEventListener("input",()=>{

document.getElementById(
"equityDisplay"
).innerHTML =
slider.value + "%";

});

function submitOffer(){

const asset =
document.getElementById(
"assetSelect"
).value;

const equity =
document.getElementById(
"equitySlider"
).value;

const amount =
document.getElementById(
"cryptoAmount"
).value;

const crypto =
document.getElementById(
"cryptoType"
).value;

if(!amount){
    alert("Enter amount");
    return;
}

offers.push({
    asset,
    equity,
    amount,
    crypto,
    timestamp:Date.now()
});

offers.sort(
(a,b)=>
Number(b.amount)
-
Number(a.amount)
);

renderLeaderboard();

}

function renderLeaderboard(){

const board =
document.getElementById(
"leaderboard"
);

board.innerHTML =
offers.map((offer,index)=>`

<div class="offer-row">

<b>#${index+1}</b><br>

${offer.asset}<br>

${offer.amount}
${offer.crypto}<br>

${offer.equity}% Equity

</div>

`).join("");

}

</script>

</body>
</html>
