<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">

	<title>AI Research Pulse</title>

	<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

	<style>
		* {
			box-sizing: border-box;
		}

		body {
			margin: 0;
			background:
				radial-gradient(circle at top, #16213e, #05070d 45%);
			color: white;
			font-family: Inter, Arial, sans-serif;
		}

		.container {
			max-width: 1200px;
			margin: auto;
			padding: 50px 24px;
		}

		h1 {
			font-size: 52px;
			margin: 0;
			letter-spacing: -2px;
		}

		.subtitle {
			color: #9ca3af;
			font-size: 18px;
			margin-top: 12px;
			margin-bottom: 40px;
		}

		.grid {
			display: grid;
			grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
			gap: 18px;
		}

		.card {
			background: rgba(255,255,255,0.06);
			border: 1px solid rgba(255,255,255,0.1);
			border-radius: 22px;
			padding: 24px;
			backdrop-filter: blur(15px);
		}

		.label {
			color: #94a3b8;
			font-size: 14px;
			text-transform: uppercase;
			letter-spacing: 1px;
		}

		.value {
			font-size: 38px;
			font-weight: 700;
			margin-top: 10px;
		}

		.green {
			color: #4ade80;
		}

		.chart-card {
			margin-top: 24px;
			height: 430px;
		}

		canvas {
			max-height: 340px;
		}

		.topic {
			display: flex;
			justify-content: space-between;
			padding: 15px 0;
			border-bottom: 1px solid rgba(255,255,255,0.08);
		}

		.topic:last-child {
			border-bottom: none;
		}

		.topic-name {
			font-weight: 600;
		}

		.topic-value {
			color: #93c5fd;
		}

		.loading {
			color: #94a3b8;
		}

		.footer {
			color: #64748b;
			margin-top: 40px;
			font-size: 13px;
		}

	</style>
</head>

<body>

<div class="container">

	<h1>AI Research Pulse</h1>

	<div class="subtitle">
		A live view of where AI research activity is concentrating.
		Powered by arXiv categories.
	</div>


	<div class="grid">

		<div class="card">
			<div class="label">
				Papers sampled
			</div>

			<div class="value" id="total">
				...
			</div>
		</div>


		<div class="card">
			<div class="label">
				Most active area
			</div>

			<div class="value green" id="leader">
				...
			</div>
		</div>


		<div class="card">
			<div class="label">
				Researchers sampled
			</div>

			<div class="value" id="authors">
				...
			</div>
		</div>

	</div>


	<div class="card chart-card">

		<h2>
			Current Research Velocity
		</h2>

		<canvas id="chart"></canvas>

	</div>


	<div class="card">

		<h2>
			AI Research Landscape
		</h2>

		<div id="topics" class="loading">
			Loading...
		</div>

	</div>


	<div class="footer">
		This dashboard measures research activity, not investment advice.
	</div>


</div>


<script>

const categories = {
	"Artificial Intelligence": "cs.AI",
	"Machine Learning": "cs.LG",
	"Computer Vision": "cs.CV",
	"Robotics": "cs.RO",
	"Natural Language": "cs.CL"
};


async function getArxiv(category) {

	const url =
		"https://export.arxiv.org/api/query?" +
		"search_query=cat:" + category +
		"&start=0" +
		"&max_results=100";


	const response = await fetch(url);

	const xml = await response.text();


	const parser = new DOMParser();

	const doc = parser.parseFromString(
		xml,
		"text/xml"
	);


	const entries =
		[...doc.querySelectorAll("entry")];


	let authors = new Set();


	entries.forEach(entry => {

		entry
			.querySelectorAll("author name")
			.forEach(a => {
				authors.add(a.textContent);
			});

	});


	return {
		papers: entries.length,
		authors: authors.size
	};

}



async function loadDashboard() {

	const results = [];


	for (const [name, category] of Object.entries(categories)) {

		const data =
			await getArxiv(category);


		results.push({
			name,
			...data
		});
	}


	const total =
		results.reduce(
			(a,b)=>a+b.papers,
			0
		);


	const authors =
		results.reduce(
			(a,b)=>a+b.authors,
			0
		);


	const leader =
		results.sort(
			(a,b)=>b.papers-a.papers
		)[0];


	document
		.getElementById("total")
		.innerText =
		total.toLocaleString();


	document
		.getElementById("authors")
		.innerText =
		authors.toLocaleString();


	document
		.getElementById("leader")
		.innerText =
		leader.name;



	document
		.getElementById("topics")
		.innerHTML =

		results.map(item =>

			`
			<div class="topic">

				<div class="topic-name">
					${item.name}
				</div>

				<div class="topic-value">
					${item.papers} papers
					/
					${item.authors} authors
				</div>

			</div>
			`

		).join("");



	new Chart(
		document.getElementById("chart"),
		{

			type: "bar",

			data: {

				labels:
					results.map(x=>x.name),

				datasets: [

					{
						data:
							results.map(x=>x.papers),

						borderRadius: 12
					}

				]

			},

			options: {

				responsive:true,

				plugins:{

					legend:{
						display:false
					}

				},

				scales:{

					x:{
						grid:{
							display:false
						}
					},

					y:{
						grid:{
							color:
							"rgba(255,255,255,0.08)"
						}
					}

				}

			}

		}
	);

}


loadDashboard();

</script>


</body>
</html>
