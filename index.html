<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>✳️💜🥷🏻Unprincipled Inc. Web3 OS🥷🏻💜✳️</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Press+Start+2P&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --text: #fff;
            --accent1: #ff00ff;
            --accent2: #00ffff;
            --glow: #ff00ff;
        }

        body {
            background: #000;
            color: var(--text);
            font-family: 'Orbitron', sans-serif;
            position: relative;
            overflow-y: auto;
            min-height: 100vh;
        }

        body[data-theme="matrix"] {
            --text: #00ff41;
            --accent1: #00ff41;
            --accent2: #00aa00;
            --glow: #00ff41;
        }

        /* CANVASES */
        #space, #matrix {
            position: fixed;
            top: 0; left: 0;
            z-index: 1;
            width: 100%; height: 100%;
            pointer-events: none;
        }
        #matrix { display: none; }

        .content {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            padding: 20px 15px 100px;
            max-width: 100%;
            margin: 0 auto;
            gap: 1.2rem;
            min-height: 100vh;
        }

        .logo {
            width: min(280px, 75vw);
            max-height: 180px;
            object-fit: contain;
            margin: 1.8rem 0 0.8rem;
            filter: drop-shadow(0 0 35px rgba(255,255,255,0.7));
        }

        .reveal {
            font-size: clamp(2.3rem, 7.5vw, 3.6rem);
            font-weight: 900;
            letter-spacing: 0.12em;
            color: var(--text);
            text-shadow: 0 0 40px var(--text), 0 0 80px var(--glow);
            opacity: 0;
            animation: pulse 4s infinite alternate;
        }

        .teaser {
            font-family: 'Press Start 2P', cursive;
            font-size: clamp(1rem, 3.5vw, 1.25rem);
            min-height: 68px;
            background: linear-gradient(90deg, #ff00ff, #00ffff, #ffff00, #ff00ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-size: 300% 300%;
            animation: rainbow 6s linear infinite;
        }

        .trampoline-game {
            width: 100%;
            max-width: 420px;
            margin: 15px auto;
            padding: 16px;
            border: 2px solid rgba(255,255,255,0.2);
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(12px);
            border-radius: 12px;
        }

        .signal-button {
            margin-top: 1.2rem;
            padding: clamp(15px, 4.5vw, 19px) clamp(40px, 10vw, 52px);
            font-family: 'Press Start 2P', cursive;
            font-size: clamp(1rem, 3.4vw, 1.12rem);
            background: transparent;
            color: var(--text);
            border: 3px solid var(--text);
            cursor: pointer;
            transition: all 0.3s;
            white-space: nowrap;
        }

        .signal-button:hover {
            background: #fff;
            color: #000;
            transform: scale(1.03);
        }

        .footer {
            margin-top: 2rem;
            font-size: clamp(0.68rem, 2vw, 0.76rem);
            opacity: 0.55;
        }

        /* SMALL THEME SLIDER */
        #theme-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 100;
            background: rgba(10,10,20,0.85);
            padding: 6px 10px;
            border-radius: 50px;
            border: 2px solid rgba(255,255,255,0.25);
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 1.3rem;
        }

        .toggle-slider {
            position: relative;
            width: 68px;
            height: 32px;
            background: rgba(255,255,255,0.1);
            border-radius: 50px;
            cursor: pointer;
            overflow: hidden;
        }

        .toggle-slider::before {
            content: '';
            position: absolute;
            top: 3px;
            left: 3px;
            width: 26px;
            height: 26px;
            background: white;
            border-radius: 50%;
            transition: all 0.35s ease;
        }

        body[data-theme="matrix"] .toggle-slider::before {
            transform: translateX(36px);
        }

        .toggle-labels {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 8px;
            pointer-events: none;
            font-size: 1.1rem;
        }
    </style>
</head>
<body data-theme="space">

    <!-- THEME BACKGROUNDS -->
    <canvas id="space"></canvas>
    <canvas id="matrix"></canvas>

    <!-- THEME TOGGLE -->
    <div id="theme-toggle">
        <span>🌌</span>
        <div class="toggle-slider" onclick="toggleTheme()"></div>
        <span>🖥️</span>
    </div>

    <div class="content">
        <div class="reveal" id="reveal">SOMETHING IS COMING…</div>
        
        <!-- 🔥 REPLACE THIS WITH YOUR IMGUR LINK -->
        <img src="https://i.imgur.com/8EebZSg.jpg" 
             alt="Unprincipled Inc. Logo" 
             class="logo">

        <div class="teaser" id="teaser">333 LORDS AND LADIES</div>

        <div class="trampoline-game">
            <div class="game-header">🏀 SKY BOUNCE 🏀</div>
            <canvas id="trampolineGame" width="420" height="260"></canvas>

            <div class="game-stats">
                <div>Height: <span id="heightScore">0</span></div>
                <div>Best: <span id="bestScore">0</span></div>
            </div>

            <div class="game-tip">TAP WHEN BALL HITS TRAMPOLINE</div>
        </div>

        <button class="signal-button" onclick="handleSignal()">
            SUPPORT WEB3 NOW
        </button>

        <div class="footer">SOLANA • 2026 • TRANSMISSION INCOMING</div>
    </div>

<script>
/* ================= SPACE & MATRIX (unchanged) ================= */
let scene, camera, renderer, particles;

function initSpace() {
    scene = new THREE.Scene();
    camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 2000);
    renderer = new THREE.WebGLRenderer({ canvas: document.getElementById("space"), alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

    const geometry = new THREE.BufferGeometry();
    const vertices = [];
    const colors = [];
    for (let i = 0; i < 9000; i++) {
        vertices.push(Math.random()*2000-1000, Math.random()*2000-1000, Math.random()*1800-900);
        let c = Math.random();
        colors.push(c, c, c);
    }
    geometry.setAttribute("position", new THREE.Float32BufferAttribute(vertices, 3));
    geometry.setAttribute("color", new THREE.Float32BufferAttribute(colors, 3));

    particles = new THREE.Points(geometry, new THREE.PointsMaterial({ size: 2, vertexColors: true, transparent: true }));
    scene.add(particles);
    camera.position.z = 5;
}

function resizeSpace() {
    if (!camera || !renderer) return;
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
}

function animateSpace() {
    requestAnimationFrame(animateSpace);
    if (particles) {
        particles.rotation.y += 0.00008;
        const pos = particles.geometry.attributes.position.array;
        for (let i = 2; i < pos.length; i += 3) {
            pos[i] += 4.5;
            if (pos[i] > 900) pos[i] = -900;
        }
        particles.geometry.attributes.position.needsUpdate = true;
        renderer.render(scene, camera);
    }
}

/* MATRIX RAIN */
let matrixCanvas, matrixCtx, matrixFontSize = 16;
let matrixColumns, matrixDrops = [];
const matrixChars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%^&*()_+-=[]{}|;:,.<>/?~アイウエオカキクケコ";

function initMatrix() {
    matrixCanvas = document.getElementById("matrix");
    matrixCtx = matrixCanvas.getContext("2d");
    resizeMatrix();
}

function resizeMatrix() {
    if (!matrixCanvas) return;
    matrixCanvas.width = window.innerWidth;
    matrixCanvas.height = window.innerHeight;
    matrixColumns = Math.floor(matrixCanvas.width / matrixFontSize);
    matrixDrops = new Array(matrixColumns).fill(1);
}

function drawMatrix() {
    matrixCtx.fillStyle = "rgba(0, 0, 0, 0.05)";
    matrixCtx.fillRect(0, 0, matrixCanvas.width, matrixCanvas.height);
    matrixCtx.fillStyle = "#00ff41";
    matrixCtx.font = `${matrixFontSize}px monospace`;
    for (let i = 0; i < matrixDrops.length; i++) {
        const text = matrixChars[Math.floor(Math.random() * matrixChars.length)];
        matrixCtx.fillText(text, i * matrixFontSize, matrixDrops[i] * matrixFontSize);
        if (matrixDrops[i] * matrixFontSize > matrixCanvas.height && Math.random() > 0.975) matrixDrops[i] = 0;
        matrixDrops[i]++;
    }
}

function animateMatrix() {
    if (document.body.dataset.theme === "matrix") drawMatrix();
    requestAnimationFrame(animateMatrix);
}

/* THEME TOGGLE */
function toggleTheme() {
    const body = document.body;
    const isMatrix = body.dataset.theme === "matrix";
    
    body.dataset.theme = isMatrix ? "space" : "matrix";
    document.getElementById("space").style.display = isMatrix ? "block" : "none";
    document.getElementById("matrix").style.display = isMatrix ? "none" : "block";
}

/* TEASER + SIGNAL + GAME (unchanged) */
const teasers = ["333 LORDS AND LADIES", "666 NOBLES", "999 PEASANTS"];
let tIndex = 0;
function cycleTeaser() {
    tIndex = (tIndex + 1) % teasers.length;
    document.getElementById("teaser").textContent = teasers[tIndex];
}

function handleSignal() {
    window.open("https://x.com/intent/tweet?text=" + encodeURIComponent("Joining Unprincipled Inc 🚀"), "_blank");
}

const gameCanvas = document.getElementById("trampolineGame");
const ctx = gameCanvas.getContext("2d");
let y = 100, v = 0, g = 0.45, floor = 200;
let score = 0, best = 0, justBounced = false;

function tap() {
    const near = y > floor - 28 && y < floor + 12 && v > 0;
    if (near) {
        v = -13; score += 10; if (score > best) best = score; justBounced = true;
    } else { v += 8; score = 0; }
}

gameCanvas.addEventListener("click", tap);
gameCanvas.addEventListener("touchstart", e => { e.preventDefault(); tap(); });

function gameLoop() {
    ctx.clearRect(0, 0, gameCanvas.width, gameCanvas.height);
    v += g; y += v;

    if (y >= floor) {
        y = floor;
        const oldV = v;
        v *= -0.5;
        if (!justBounced && oldV > 0) score = 0;
        justBounced = false;
    }

    ctx.strokeStyle = "#00ffff"; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(120, floor); ctx.lineTo(300, floor); ctx.stroke();

    ctx.fillStyle = "#fff";
    ctx.beginPath(); ctx.arc(210, y, 10, 0, Math.PI * 2); ctx.fill();

    document.getElementById("heightScore").innerText = score;
    document.getElementById("bestScore").innerText = best;
    requestAnimationFrame(gameLoop);
}

/* INIT */
window.onload = () => {
    initSpace(); animateSpace();
    initMatrix(); animateMatrix();

    window.addEventListener("resize", () => { resizeSpace(); resizeMatrix(); });

    setTimeout(() => document.getElementById("reveal").style.opacity = 1, 400);
    setInterval(cycleTeaser, 3800);
    gameLoop();

    document.getElementById("space").style.display = "block";
};
</script>
</body>
</html>
